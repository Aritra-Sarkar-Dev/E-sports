name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses and install platform 35
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b1d873ae03b00fa7b0ae69f11f1a57\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b1d873ae03b00fa7b0ae69f11f1a57" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Print error diagnostics on failure
        if: failure()
        run: |
          grep -n -E "What went wrong|FAILURE|error:|^e: |Unresolved|Execution failed" -A 6 build.log | head -n 120 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify APK output
        run: |
          echo "Listing generated APK files:"
          ls -R app/build/outputs/apk
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK not found at $TARGET_APK"
            exit 1
          fi
          echo "✓ Successfully verified $TARGET_APK (Size: $(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        if: success()
        run: |
          TMP_DIR=$(mktemp -d)
          ASSET_FILE="${TMP_DIR}/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_FILE"
          echo "asset_path=${ASSET_FILE}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          TAG_NAME: v1.0.0-build-${{ github.run_number }}
          RELEASE_TITLE: FF Arena Esports v1.0.0 (Build #${{ github.run_number }})
        run: |
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK Build #${{ github.run_number }} - Ready for download and install." \
            --latest

      - name: Report APK download result
        if: always()
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          echo "### 🚀 APK READY FOR DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[📥 **Click here to download app-debug.apk directly**](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct Download URL: \`${DIRECT_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release Tag: \`v1.0.0-build-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact name: \`app-debug-apk\` (available at bottom of this run summary)" >> "$GITHUB_STEP_SUMMARY"
