name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java 17 or newer is required."
            exit 1
          fi
          echo "Java 17 verified successfully."

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi
          echo "Android SDK licenses accepted."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up debug signing keystore
        run: |
          mkdir -p ~/.android
          if [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ~/.android/debug.keystore
          elif [ -f "./debug.keystore" ]; then
            cp ./debug.keystore ~/.android/debug.keystore
          else
            echo "Generating new debug keystore..."
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp ~/.android/debug.keystore ./debug.keystore
          if [ ! -s ~/.android/debug.keystore ]; then
            echo "Error: ~/.android/debug.keystore is empty or missing."
            exit 1
          fi
          echo "Debug keystore configured successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK file not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk/:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file at $TARGET_APK is empty (0 bytes)."
            exit 1
          fi
          echo "✓ Verified APK at $TARGET_APK (Size: $(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          ASSET_FILE="${TMP_DIR}/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_FILE"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_path=${ASSET_FILE}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at ${ASSET_FILE}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          TAG_NAME: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
        run: |
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is invalid."
            exit 1
          fi
          NOTES=$(cat <<EOF
          ### FF Arena Esports - Debug APK Build
          - **Build Source:** GitHub Actions Automated CI/CD
          - **Run Number:** ${{ github.run_number }}
          - **Commit SHA:** ${{ github.sha }}
          - **APK Filename:** app-debug.apk
          - **Status:** Ready for download and installation
          EOF
          )
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          echo "### 🚀 APK READY FOR DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[📥 **Click here to download app-debug.apk directly**](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct Download URL: \`${DIRECT_URL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Release Tag: \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK artifact is also attached to this GitHub Actions run under Artifacts (\`app-debug-apk\`)." >> "$GITHUB_STEP_SUMMARY"
